name: Micro Pipeline Standardized

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      GITOPS_TOKEN:
        required: true
      ACR_USERNAME:
        required: true
      ACR_PASSWORD:
        required: true

env:
  NEXUS_CERT_PATH: /home/ubuntu/nexus/certs/nexus.crt

jobs:
  discover:
    runs-on: self-hosted
    outputs:
      services: ${{ steps.scan.outputs.services }}
      app_name: ${{ steps.scan.outputs.app_name }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Scan services
        id: scan
        run: |
          APP_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          
          SERVICES="["
          FIRST=true
          
          # Scan root-level service directories
          for dir in */; do
            dir="${dir%/}"
            case "${dir}" in .github|.git|node_modules|target|dist|docs|scripts|config|helm|k8s|frontend|backend) continue ;; esac
            if [ -f "${dir}/Dockerfile" ]; then
              [ "${FIRST}" = "false" ] && SERVICES="${SERVICES},"
              SERVICES="${SERVICES}\"${dir}\""
              FIRST="false"
            fi
          done
          
          # Scan backend sub-services
          if [ -d "backend" ]; then
            for dir in backend/*/; do
              [ -d "${dir}" ] || continue
              dir="${dir%/}"; dir="${dir##*/}"
              if [ -f "backend/${dir}/Dockerfile" ]; then
                [ "${FIRST}" = "false" ] && SERVICES="${SERVICES},"
                SERVICES="${SERVICES}\"backend/${dir}\""
                FIRST="false"
              fi
            done
          fi
          
          SERVICES="${SERVICES}]"
          
          # SAFETY CHECK: Fail fast if no services found instead of crashing matrix
          if [ "${SERVICES}" = "[]" ]; then
            echo "ERROR: No Dockerfiles found in expected locations"
            echo "Current directory structure:"
            find . -maxdepth 3 -name "Dockerfile" -type f
            exit 1
          fi
          
          echo "services=${SERVICES}" >> "$GITHUB_OUTPUT"
          echo "Found services: ${SERVICES}"

  build-service:
    needs: discover
    runs-on: self-hosted
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    env:
      APP_NAME: ${{ needs.discover.outputs.app_name }}
      SERVICE_PATH: ${{ matrix.service }}
      REGISTRY: ${{ inputs.environment == 'production' && 'windazureacr.azurecr.io' || '192.168.1.239:8085/selfkhaoula' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          SERVICE_NAME=$(basename "${{ env.SERVICE_PATH }}")
          echo "SERVICE=${SERVICE_NAME}" >> "$GITHUB_ENV"
          echo "IMAGE=${{ env.REGISTRY }}/${{ env.APP_NAME }}-${SERVICE_NAME}:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Pre-cleanup
        run: |
          docker rm -f "test-db-${{ env.SERVICE }}" 2>/dev/null || true
          docker rm -f "smoke-${{ env.SERVICE }}" 2>/dev/null || true

      - name: Setup Docker credentials
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "${{ secrets.ACR_PASSWORD }}" | docker login windazureacr.azurecr.io -u ${{ secrets.ACR_USERNAME }} --password-stdin
          else
            sudo mkdir -p /etc/docker/certs.d/192.168.1.239:8085
            sudo cp ${{ env.NEXUS_CERT_PATH }} /etc/docker/certs.d/192.168.1.239:8085/ca.crt
            sudo update-ca-certificates
            echo "nexus111" | docker login 192.168.1.239:8085 -u admin --password-stdin
          fi

      - name: Check if image exists
        id: check_image
        run: |
          SKIP="false"
          if docker manifest inspect "${{ env.IMAGE }}" >/dev/null 2>&1; then SKIP="true"; fi
          echo "SKIP_BUILD=${SKIP}" >> "$GITHUB_ENV"

      - name: Detect technology
        id: detect
        if: env.SKIP_BUILD != 'true'
        run: |
          DB_TYPE="none"; HAS_MAVEN=false; JAVA_VERSION="17"
          if [ -f "${{ env.SERVICE_PATH }}/pom.xml" ]; then
            HAS_MAVEN=true
            JAVA_VERSION=$(grep -oP '(?<=<java.version>)[^<]+' "${{ env.SERVICE_PATH }}/pom.xml" 2>/dev/null | head -1)
            [ -z "${JAVA_VERSION}" ] && JAVA_VERSION="17"
            if grep -q "postgresql" "${{ env.SERVICE_PATH }}/pom.xml"; then DB_TYPE="postgresql"
            elif grep -q "mysql" "${{ env.SERVICE_PATH }}/pom.xml"; then DB_TYPE="mysql"
            fi
          fi
          echo "HAS_MAVEN=${HAS_MAVEN}" >> "$GITHUB_ENV"
          echo "JAVA_VERSION=${JAVA_VERSION}" >> "$GITHUB_ENV"
          echo "DB_TYPE=${DB_TYPE}" >> "$GITHUB_ENV"

      - name: Run Java tests
        if: env.HAS_MAVEN == 'true' && env.SKIP_BUILD != 'true'
        continue-on-error: true
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}/${{ env.SERVICE_PATH }}:/app" \
            -v "$HOME/.m2:/root/.m2" \
            -w /app \
            -e SPRING_PROFILES_ACTIVE=test,native \
            -e SPRING_CLOUD_CONFIG_ENABLED=false \
            -e SPRING_CLOUD_DISCOVERY_ENABLED=false \
            -e EUREKA_CLIENT_ENABLED=false \
            -e SPRING_MAIL_HOST=localhost \
            -e SPRING_MAIL_PORT=25 \
            -e MANAGEMENT_HEALTH_MAIL_ENABLED=false \
            -e JWT_SECRET=ci-secret-key-for-testing-purposes-only-1234567890 \
            192.168.1.239:8085/selfkhaoula/maven:3.9-eclipse-temurin-${{ env.JAVA_VERSION }} \
            mvn test -B -DskipTests=false || echo "Tests failed but non-blocking"

      - name: Package Application
        if: env.HAS_MAVEN == 'true' && env.SKIP_BUILD != 'true'
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}/${{ env.SERVICE_PATH }}:/app" \
            -v "$HOME/.m2:/root/.m2" \
            -w /app \
            192.168.1.239:8085/selfkhaoula/maven:3.9-eclipse-temurin-${{ env.JAVA_VERSION }} \
            mvn package -B -DskipTests

      - name: Build Docker image
        if: env.SKIP_BUILD != 'true'
        run: |
          docker build -f "${{ env.SERVICE_PATH }}/Dockerfile" -t "${{ env.IMAGE }}" "${{ env.SERVICE_PATH }}"

      - name: Security scan
        if: env.SKIP_BUILD != 'true'
        continue-on-error: true
        run: trivy image --severity HIGH,CRITICAL --exit-code 0 "${{ env.IMAGE }}"

      - name: Smoke test
        if: env.SKIP_BUILD != 'true'
        run: |
          CONTAINER_ID=$(docker run -d --name smoke-${{ env.SERVICE }} \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e SPRING_CLOUD_CONFIG_ENABLED=false \
            -e SPRING_CLOUD_DISCOVERY_ENABLED=false \
            -e EUREKA_CLIENT_ENABLED=false \
            "${{ env.IMAGE }}")
          MAX_WAIT=30; WAITED=0
          while [ $WAITED -lt $MAX_WAIT ]; do
            STATUS=$(docker inspect --format='{{.State.Status}}' "${CONTAINER_ID}" 2>/dev/null || echo "gone")
            if [ "${STATUS}" = "running" ]; then
              echo "Container started successfully"; docker stop "${CONTAINER_ID}"; exit 0
            elif [ "${STATUS}" = "exited" ]; then
              echo "Container stopped prematurely"; docker logs "${CONTAINER_ID}"; exit 1
            fi
            sleep 2; WAITED=$((WAITED + 2))
          done
          echo "Timeout"; docker logs "${CONTAINER_ID}"; exit 1

      - name: Push image
        if: env.SKIP_BUILD != 'true'
        run: docker push "${{ env.IMAGE }}"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f test-db-${{ env.SERVICE }} 2>/dev/null || true
          docker rm -f smoke-${{ env.SERVICE }} 2>/dev/null || true

  gitops:
    needs: [discover, build-service]
    runs-on: self-hosted
    if: success()
    concurrency:
      group: gitops-environments-push-${{ inputs.environment }}
      cancel-in-progress: false
    
    environment: ${{ inputs.environment }}
    
    env:
      APP_NAME: ${{ needs.discover.outputs.app_name }}
      ENV: ${{ inputs.environment }}
      REGISTRY: ${{ inputs.environment == 'production' && 'windazureacr.azurecr.io' || '192.168.1.239:8085/selfkhaoula' }}

    steps:
      - uses: actions/checkout@v4
      - name: Checkout devops-templates
        uses: actions/checkout@v4
        with:
          repository: winddevops-org/devops-templates
          path: devops-templates
          token: ${{ secrets.GITOPS_TOKEN }}
      - name: Update GitOps
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_TOKEN }}
          SHA: ${{ github.sha }}
          SERVICES: ${{ needs.discover.outputs.services }}
        run: |
          git clone "https://x-access-token:${GITOPS_PAT}@github.com/winddevops-org/gitops-environments.git" gitops-environments
          cd gitops-environments
          git config user.email "ci@github.com"; git config user.name "GitHub Actions"
          SERVICES_JSON='${{ env.SERVICES }}'
          SERVICES_LIST=$(echo "${SERVICES_JSON}" | jq -r '.[]')
          for SERVICE_PATH in ${SERVICES_LIST}; do
            SERVICE_NAME=$(basename "${SERVICE_PATH}")
            COMP="${APP_NAME}-${SERVICE_NAME}"
            VPATH="environments/${ENV}/${COMP}/values.yaml"
            mkdir -p "$(dirname "${VPATH}")"
            if [ ! -f "${VPATH}" ]; then
              REPLICA_COUNT=1
              [ "${ENV}" = "production" ] && REPLICA_COUNT=2
              
              printf '%s\n' "name: ${COMP}" "namespace: ${ENV}-${COMP}" "replicaCount: ${REPLICA_COUNT}" "image:" "  repository: \"${REGISTRY}/${COMP}\"" "  tag: \"${SHA}\"" "  pullPolicy: IfNotPresent" "imagePullSecrets:" "- name: nexus-registry-secret" "service:" "  type: ClusterIP" "  port: 80" "  targetPort: 80" "ingress:" "  enabled: true" "  className: nginx" "  host: ${COMP}.${ENV}.local" "  path: /" "  pathType: Prefix" "resources:" "  limits:" "    cpu: 500m" "    memory: 512Mi" "  requests:" "    cpu: 250m" "    memory: 256Mi" "env: []" > "${VPATH}"
            else
              sed -i "s|repository:.*|repository: \"${REGISTRY}/${COMP}\"|" "${VPATH}"
              sed -i "s|tag:.*|tag: \"${SHA}\"|" "${VPATH}"
              if [ "${ENV}" = "production" ]; then
                sed -i "s|replicaCount:.*|replicaCount: 2|" "${VPATH}"
              fi
            fi
            APATH="argocd-applications/${COMP}-${ENV}.yaml"
            mkdir -p argocd-applications
            if [ ! -f "${APATH}" ]; then
              printf '%s\n' "apiVersion: argoproj.io/v1alpha1" "kind: Application" "metadata:" "  name: ${COMP}-${ENV}" "  namespace: argocd" "spec:" "  project: stagiaires" "  sources:" "    - repoURL: https://github.com/winddevops-org/devops-templates" "      targetRevision: main" "      path: helm-charts/app-generic" "      helm:" "        valueFiles:" "          - \$values/environments/${ENV}/${COMP}/values.yaml" "    - repoURL: https://github.com/winddevops-org/gitops-environments" "      targetRevision: main" "      ref: values" "  destination:" "    server: https://kubernetes.default.svc" "    namespace: ${ENV}-${COMP}" "  syncPolicy:" "    automated:" "      prune: true" "      selfHeal: true" "    syncOptions:" "      - CreateNamespace=true" > "${APATH}"
            fi
          done
          git add .
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git commit -m "[${APP_NAME}] deploy all microservices -> ${SHA} (env: ${ENV})"
          ATTEMPTS=0; MAX_ATTEMPTS=5
          until git push origin main; do
            ATTEMPTS=$((ATTEMPTS + 1))
            if [ "${ATTEMPTS}" -ge "${MAX_ATTEMPTS}" ]; then echo "Push failed."; exit 1; fi
            echo "Retrying push..."; sleep $((RANDOM % 5 + 1)); git pull --rebase origin main
          done
