apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name | default .Release.Name }}
  labels:
    app: {{ .Values.name | default .Release.Name }}
    version: {{ .Values.image.tag }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.name | default .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name | default .Release.Name }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- if .Values.database.enabled }}
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "app-generic.dbServiceName" . }} {{ include "app-generic.dbPort" . | trim }}; do
                echo "DB non prete, attente 3s..."
                sleep 3
              done
              echo "DB prete !"
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            {{- if .Values.env }}
            {{- toYaml .Values.env | nindent 12 }}
            {{- end }}
            {{- include "app-generic.dbEnvVars" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          # --- AJOUT : monte le fichier persistant sans toucher au reste du conteneur (subPath)
          volumeMounts:
            - name: persistent-data
              mountPath: "{{ .Values.persistence.mountDir }}/{{ .Values.persistence.fileName }}"
              subPath: "{{ .Values.persistence.fileName }}"
          {{- end }}
      {{- if .Values.persistence.enabled }}
      # --- AJOUT : volume relie au PVC dedie (voir pvc.yaml)
      volumes:
        - name: persistent-data
          persistentVolumeClaim:
            claimName: {{ .Values.name | default .Release.Name }}-data
      {{- end }}
