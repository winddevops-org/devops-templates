name: Deploy Template Hybrid CI/CD

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: 'Cible de déploiement: staging ou production'
      force_deploy:
        required: false
        type: string
        default: 'false'
        description: 'Forcer le déploiement même si aucune modification détectée'
    secrets:
      GITOPS_TOKEN:
        required: true
      ACR_USERNAME:
        required: true
      ACR_PASSWORD:
        required: true

jobs:
  detect:
    runs-on: self-hosted
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      app_name: ${{ steps.scan.outputs.app_name }}
      db_type: ${{ steps.detect.outputs.db_type }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Detect Mode and Scan
        id: scan
        run: |
          APP_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          
          DEPLOY_MODE="mono"
          DB_TYPE="none"
          
          if [ -d "frontend" ] && [ -f "frontend/Dockerfile" ]; then DEPLOY_MODE="front-only"; fi
          if [ -d "backend" ] && [ -f "backend/Dockerfile" ]; then 
            [ "${DEPLOY_MODE}" = "front-only" ] && DEPLOY_MODE="dual" || DEPLOY_MODE="back-only"
          fi
          
          if grep -q "postgresql" backend/pom.xml 2>/dev/null; then DB_TYPE="postgresql"; fi
          
          echo "mode=${DEPLOY_MODE}" >> "$GITHUB_OUTPUT"
          echo "db_type=${DB_TYPE}" >> "$GITHUB_OUTPUT"

  build-service:
    needs: detect
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      APP_NAME: ${{ needs.detect.outputs.app_name }}
      REGISTRY: ${{ inputs.environment == 'production' && 'windazureacr.azurecr.io' || '192.168.1.239:8085/selfkhaoula' }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Login to Azure Container Registry (Prod only)
        if: inputs.environment == 'production'
        uses: azure/docker-login@v1
        with:
          login-server: windazureacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      
      - name: Login to Nexus Registry (Staging only)
        if: inputs.environment != 'production'
        run: |
          echo "nexus111" | docker login 192.168.1.239:8085 -u admin --password-stdin

      - name: Build and Push Image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.APP_NAME }}:${{ github.sha }}"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"

  gitops:
    needs: [detect, build-service]
    runs-on: self-hosted
    if: success()
    
    # 🔒 PORTE DE SÉCURITÉ : Bloque jusqu'à approbation manuelle en prod
    environment: ${{ inputs.environment }}
    
    env:
      ENV: ${{ inputs.environment }}
      APP_NAME: ${{ needs.detect.outputs.app_name }}
      SHA: ${{ github.sha }}
      DB_TYPE: ${{ needs.detect.outputs.db_type }}
      DEPLOY_MODE: ${{ needs.detect.outputs.mode }}
      REGISTRY: ${{ inputs.environment == 'production' && 'windazureacr.azurecr.io' || '192.168.1.239:8085/selfkhaoula' }}
      GITOPS_PAT: ${{ secrets.GITOPS_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Update GitOps Manifests
        run: |
          chmod +x scripts/update-gitops.sh
          ./scripts/update-gitops.sh
