# .github/workflows/deploy-template.yml
name: Deploy Template (Hybrid CI/CD)

on:
  # MODE 1 : Automatique (Push sur main)
  push:
    branches: [main]
  
  # MODE 2 : Manuel (Dashboard / UI GitHub)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      force_deploy:
        description: 'Force rebuild even if image exists?'
        required: false
        default: 'false'
        type: boolean

jobs:
  detect:
    runs-on: self-hosted
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      app_name: ${{ steps.scan.outputs.app_name }}
      services: ${{ steps.scan.outputs.services }}
      db_type: ${{ steps.detect.outputs.db_type }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect Mode & Scan
        id: scan
        run: |
          APP_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          
          # Ta logique de détection mono/micro/dual existante...
          # Exemple simplifié pour l'exemple :
          DEPLOY_MODE="mono"
          DB_TYPE="none"
          
          if [ -d "frontend" ] && [ -f "frontend/Dockerfile" ]; then DEPLOY_MODE="front-only"; fi
          if [ -d "backend" ] && [ -f "backend/Dockerfile" ]; then 
            [ "${DEPLOY_MODE}" = "front-only" ] && DEPLOY_MODE="dual" || DEPLOY_MODE="back-only"
          fi
          
          # Détection DB (ta logique existante)
          if grep -q "postgresql" backend/pom.xml 2>/dev/null; then DB_TYPE="postgresql"; fi
          
          echo "mode=${DEPLOY_MODE}" >> "$GITHUB_OUTPUT"
          echo "db_type=${DB_TYPE}" >> "$GITHUB_OUTPUT"
          echo "services=[]" >> "$GITHUB_OUTPUT" # À adapter selon ta logique microservices
          echo "✅ Detected: ${DEPLOY_MODE} | DB: ${DB_TYPE}"

  build-service:
    needs: detect
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      APP_NAME: ${{ needs.detect.outputs.app_name }}
      REGISTRY: 192.168.1.239:8085/selfkhaoula
      NEXUS_CERT_PATH: /home/ubuntu/nexus/certs/nexus.crt

    steps:
      - uses: actions/checkout@v4
      
      - name: Build & Push Image
        run: |
          # Ta logique de build/test/push existante...
          # Utilise ${{ github.sha }} comme tag
          IMAGE="${{ env.REGISTRY }}/${{ env.APP_NAME }}:${{ github.sha }}"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"

  gitops:
    needs: [detect, build-service]
    runs-on: self-hosted
    if: success()
    
    # ==========================================
    # C'EST ICI QUE LA MAGIE OPÈRE
    # ==========================================
    env:
      # Si workflow_dispatch -> prend l'input, sinon défaut 'staging'
      ENV: ${{ github.event.inputs.environment || 'staging' }}
      APP_NAME: ${{ needs.detect.outputs.app_name }}
      SHA: ${{ github.sha }}
      DB_TYPE: ${{ needs.detect.outputs.db_type }}
      DEPLOY_MODE: ${{ needs.detect.outputs.mode }}
      REGISTRY: 192.168.1.239:8085/selfkhaoula
      GITOPS_PAT: ${{ secrets.GITOPS_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Update GitOps Manifests
        run: |
          # Ton script EXISTANT est appelé tel quel !
          # Il reçoit ENV, DB_TYPE, DEPLOY_MODE etc. via l'environnement du job
          chmod +x scripts/update-gitops.sh
          ./scripts/update-gitops.sh
