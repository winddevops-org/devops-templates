name: Deploy Template (Hybrid)

on:
  # 1. Déclenchement Automatique (CI/CD Classique)
  push:
    branches: [main]
  
  # 2. Déclenchement Manuel (Depuis Dashboard ou UI GitHub)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      force_deploy:
        description: 'Force deploy even if image exists?'
        required: false
        default: 'false'
        type: boolean

jobs:
  detect:
    runs-on: self-hosted
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      env_target: ${{ github.event.inputs.environment || 'staging' }} # Fallback pour push auto
    steps:
      # ... Ta logique de détection mono/micro actuelle ...
      # Ajoute juste cette ligne pour passer l'environnement aux jobs suivants
      - name: Set Environment Target
        run: echo "env_target=${{ github.event.inputs.environment || 'staging' }}" >> "$GITHUB_OUTPUT"

  # Tes jobs mono et micro actuels...
  # Assure-toi qu'ils reçoivent l'input 'environment' via needs.detect.outputs.env_target
