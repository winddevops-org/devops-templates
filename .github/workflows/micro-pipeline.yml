name: Micro Pipeline

on:
  workflow_call:
    secrets:
      GITOPS_TOKEN:
        required: true

jobs:
  # ── DISCOVER : Scan des microservices ───────────────────────────
  discover:
    runs-on: self-hosted
    outputs:
      services: ${{ steps.scan.outputs.services }}
      app_name: ${{ steps.scan.outputs.app_name }}
    steps:
      - name: Clean workspace
        run: |
          sudo git clean -ffdx 2>/dev/null || \
          sudo find "${{ github.workspace }}" -mindepth 1 -delete 2>/dev/null || true

      - uses: actions/checkout@v4

      - name: Scan services
        id: scan
        run: |
          APP_NAME=$(echo "${{ github.event.repository.name }}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9-]/-/g')
          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"

          SERVICES="["
          FIRST=true
          for dir in */; do
            dir="${dir%/}"
            case "${dir}" in
              .github|.git|node_modules|target|dist|docs|scripts|config|helm|k8s|frontend|backend) continue ;;
            esac
            if [ -f "${dir}/Dockerfile" ]; then
              [ "${FIRST}" = "false" ] && SERVICES="${SERVICES},"
              SERVICES="${SERVICES}\"${dir}\""
              FIRST="false"
              echo "✅ Service détecté : ${dir}"
            fi
          done
          SERVICES="${SERVICES}]"
          echo "services=${SERVICES}" >> "$GITHUB_OUTPUT"

  # ── BUILD SERVICE : Matrice pour chaque microservice ────────────
  build-service:
    needs: discover
    runs-on: self-hosted
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    env:
      APP_NAME: ${{ needs.discover.outputs.app_name }}
      SERVICE:  ${{ matrix.service }}
      REGISTRY: 192.168.1.239:8085/selfkhaoula

    steps:
      - name: Clean workspace
        run: |
          sudo git clean -ffdx 2>/dev/null || \
          sudo find "${{ github.workspace }}" -mindepth 1 -delete 2>/dev/null || true

      - uses: actions/checkout@v4

      # ── DETECT TECHNOLOGY ─────────────────────────────────────
      - name: Detect technology & Database
        run: |
          SERVICE="${{ env.SERVICE }}"
          DB_TYPE="none"

          # Java/Maven
          if [ -f "${SERVICE}/pom.xml" ]; then
            echo "HAS_MAVEN=true" >> "$GITHUB_ENV"
            JAVA_VERSION=$(grep -oP '(?<=<java.version>)[^<]+' "${SERVICE}/pom.xml" 2>/dev/null | head -1)
            [ -z "${JAVA_VERSION}" ] && JAVA_VERSION=$(grep -oP '(?<=<maven.compiler.source>)[^<]+' "${SERVICE}/pom.xml" 2>/dev/null | head -1)
            [ -z "${JAVA_VERSION}" ] && JAVA_VERSION="17"
            echo "JAVA_VERSION=${JAVA_VERSION}" >> "$GITHUB_ENV"

            if grep -q "postgresql" "${SERVICE}/pom.xml"; then DB_TYPE="postgresql"
            elif grep -q "mysql-connector" "${SERVICE}/pom.xml"; then DB_TYPE="mysql"
            elif grep -q "mongodb-driver" "${SERVICE}/pom.xml" || grep -q "mongo-java-driver" "${SERVICE}/pom.xml"; then DB_TYPE="mongodb"
            elif grep -q "h2" "${SERVICE}/pom.xml"; then DB_TYPE="h2"
            fi
          else
            echo "HAS_MAVEN=false" >> "$GITHUB_ENV"
          fi

          # Python
          if [ -f "${SERVICE}/requirements.txt" ]; then
            echo "HAS_PYTHON=true" >> "$GITHUB_ENV"
            if grep -q "psycopg2" "${SERVICE}/requirements.txt"; then DB_TYPE="postgresql"
            elif grep -q "mysqlclient" "${SERVICE}/requirements.txt" || grep -q "PyMySQL" "${SERVICE}/requirements.txt"; then DB_TYPE="mysql"
            elif grep -q "pymongo" "${SERVICE}/requirements.txt"; then DB_TYPE="mongodb"
            fi
          else
            echo "HAS_PYTHON=false" >> "$GITHUB_ENV"
          fi

          # Go
          if [ -f "${SERVICE}/go.mod" ]; then
            echo "HAS_GO=true" >> "$GITHUB_ENV"
            if grep -q "lib/pq" "${SERVICE}/go.mod" || grep -q "pgx" "${SERVICE}/go.mod"; then DB_TYPE="postgresql"
            elif grep -q "go-sql-driver/mysql" "${SERVICE}/go.mod"; then DB_TYPE="mysql"
            elif grep -q "mongo-driver" "${SERVICE}/go.mod"; then DB_TYPE="mongodb"
            fi
          else
            echo "HAS_GO=false" >> "$GITHUB_ENV"
          fi

          # Node.js
          if [ -f "${SERVICE}/package.json" ]; then
            if grep -q '"pg"' "${SERVICE}/package.json"; then DB_TYPE="postgresql"
            elif grep -q '"mysql2"' "${SERVICE}/package.json"; then DB_TYPE="mysql"
            elif grep -q '"mongoose"' "${SERVICE}/package.json"; then DB_TYPE="mongodb"
            fi
          fi

          # Angular/Frontend
          [ -f "${SERVICE}/angular.json" ] && echo "HAS_ANGULAR=true" >> "$GITHUB_ENV" || echo "HAS_ANGULAR=false" >> "$GITHUB_ENV"

          echo "DB_TYPE=${DB_TYPE}" >> "$GITHUB_ENV"
          echo "IMAGE=${{ env.REGISTRY }}/${{ env.APP_NAME }}-${{ env.SERVICE }}:${{ github.sha }}" >> "$GITHUB_ENV"
          echo "✅ Service: ${SERVICE} | DB: ${DB_TYPE}"

      # ── SKIP INTELLIGENT ──────────────────────────────────────
      - name: "🔍 Vérifier si l'image existe déjà"
        id: check_image
        run: |
          SKIP="false"
          IMG="${{ env.REGISTRY }}/${{ env.APP_NAME }}-${{ env.SERVICE }}:${{ github.sha }}"
          if docker manifest inspect "$IMG" >/dev/null 2>&1; then
            SKIP="true"
            echo "LOCAL_IMAGE=${IMG}" >> "$GITHUB_ENV"
          fi
          echo "SKIP_BUILD=${SKIP}" >> "$GITHUB_ENV"
          if [ "$SKIP" = "true" ]; then
            echo "✅ Image déjà présente pour ce commit. Skip Build & Push."
          else
            echo "🚀 Image non trouvée. Build & Push lancé."
          fi

      # ── DOCKER LOGIN ──────────────────────────────────────────
      - name: Trust Nexus certificate
        if: env.SKIP_BUILD != 'true'
        run: |
          sudo mkdir -p /etc/docker/certs.d/192.168.1.239:8085
          sudo cp /home/ubuntu/nexus/certs/nexus.crt /etc/docker/certs.d/192.168.1.239:8085/ca.crt
          sudo cp /home/ubuntu/nexus/certs/nexus.crt /usr/local/share/ca-certificates/nexus.crt
          sudo update-ca-certificates

      - name: Docker login
        if: env.SKIP_BUILD != 'true'
        run: echo "nexus111" | docker login 192.168.1.239:8085 -u admin --password-stdin

      # ── INSTALL FRONTEND ──────────────────────────────────────
      - name: Install frontend dependencies
        if: env.HAS_ANGULAR == 'true' && env.SKIP_BUILD != 'true'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/${{ env.SERVICE }}:/app" -w /app \
            192.168.1.239:8085/selfkhaoula/node:20-alpine \
            npm install --legacy-peer-deps --loglevel=error --no-fund

      # ── TESTS ─────────────────────────────────────────────────
      - name: "🧪 Test Angular"
        if: env.HAS_ANGULAR == 'true' && env.SKIP_BUILD != 'true'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/${{ env.SERVICE }}:/app" -w /app --cap-add=SYS_ADMIN \
            192.168.1.239:8085/selfkhaoula/node:20-browsers \
            npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox 2>&1 | tee "${{ env.SERVICE }}-test.log"

      - name: "🧪 Test Java"
        if: env.HAS_MAVEN == 'true' && env.SKIP_BUILD != 'true'
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            -v "$PWD/${{ env.SERVICE }}:/app" -w /app \
            -v "$HOME/.m2:/root/.m2" \
            -e MAVEN_OPTS="-Xmx512m" \
            -e SPRING_DATASOURCE_URL="jdbc:postgresql://localhost:5432/testdb" \
            -e SPRING_DATASOURCE_USERNAME="testuser" \
            -e SPRING_DATASOURCE_PASSWORD="testpass" \
            192.168.1.239:8085/selfkhaoula/maven:3.9-eclipse-temurin-${{ env.JAVA_VERSION }} \
            mvn test -B -Dspring.profiles.active=test -DskipTests=false \
          || {
            echo "=== SUREFIRE FAILURE REPORTS ==="
            find "$PWD/${{ env.SERVICE }}/target/surefire-reports" -name "*.txt" \
              -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null || true
            exit 1
          }

      - name: "🧪 Test Python"
        if: env.HAS_PYTHON == 'true' && env.SKIP_BUILD != 'true'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/${{ env.SERVICE }}:/app" -w /app \
            192.168.1.239:8085/selfkhaoula/python:3.11-slim \
            sh -c "pip install -r requirements.txt -q && pytest --tb=short"

      - name: "🧪 Test Go"
        if: env.HAS_GO == 'true' && env.SKIP_BUILD != 'true'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/${{ env.SERVICE }}:/app" -w /app \
            192.168.1.239:8085/selfkhaoula/golang:1.22-alpine \
            go test ./... -v

      # ── LINT ──────────────────────────────────────────────────
      - name: "🔍 Lint frontend (ESLint)"
        if: env.HAS_ANGULAR == 'true' && env.SKIP_BUILD != 'true'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/${{ env.SERVICE }}:/app" -w /app \
            192.168.1.239:8085/selfkhaoula/node:20-alpine \
            sh -c "if node -e \"const p=require('./package.json'); process.exit(p.scripts&&p.scripts.lint?0:1);\" 2>/dev/null; then npm run lint; else echo '⚠️ Pas de script lint, ignoré.'; fi"

      - name: "🔍 Lint backend (Checkstyle)"
        if: env.HAS_MAVEN == 'true' && env.SKIP_BUILD != 'true'
        run: |
          if grep -qi "checkstyle" "${{ env.SERVICE }}/pom.xml"; then
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "$PWD/${{ env.SERVICE }}:/app" -w /app \
              192.168.1.239:8085/selfkhaoula/maven:3.9-eclipse-temurin-${{ env.JAVA_VERSION }} \
              mvn checkstyle:check -B
          else
            echo "⚠️ Checkstyle non configuré, ignoré."
          fi

      - name: "🔍 Lint Dockerfile (hadolint)"
        if: env.SKIP_BUILD != 'true'
        run: |
          DOCKERFILE="${{ env.SERVICE }}/Dockerfile"
          if [ ! -f "${DOCKERFILE}" ]; then
            echo "⚠️ Dockerfile non trouvé: ${DOCKERFILE}, ignoré."
            exit 0
          fi
          if ! grep -q '^FROM\s' "${DOCKERFILE}"; then
            echo "❌ ${DOCKERFILE} ne contient aucune instruction FROM."
            head -n10 "${DOCKERFILE}"
            exit 1
          fi
          echo "→ Lint: ${DOCKERFILE}"
          docker run --rm -v "${GITHUB_WORKSPACE}/${{ env.SERVICE }}:/mnt" \
            192.168.1.239:8085/selfkhaoula/hadolint:latest \
            hadolint --failure-threshold error /mnt/Dockerfile || \
            echo "⚠️ hadolint warnings ignorés pour ${DOCKERFILE}"

      # ── BUILD & PUSH ──────────────────────────────────────────
      - name: "🐳 Build"
        if: env.SKIP_BUILD != 'true'
        run: |
          docker build \
            -f "${{ env.SERVICE }}/Dockerfile" \
            -t "${{ env.IMAGE }}" \
            "${{ env.SERVICE }}"

      - name: "🔒 Trivy scan"
        if: env.SKIP_BUILD != 'true'
        run: |
          trivy image --severity HIGH,CRITICAL --exit-code 0 --ignore-unfixed "${{ env.IMAGE }}"

      - name: "🔥 Smoke test"
        if: env.SKIP_BUILD != 'true'
        run: |
          CONTAINER_ID=$(docker run -d --rm "${{ env.IMAGE }}" 2>/dev/null || true)
          if [ -z "${CONTAINER_ID}" ]; then
            echo "❌ Container non démarré : ${{ env.IMAGE }}"
            exit 1
          fi
          sleep 5
          STATUS=$(docker inspect --format='{{.State.Status}}' "${CONTAINER_ID}" 2>/dev/null || echo "gone")
          if [ "${STATUS}" = "exited" ]; then
            EXIT_CODE=$(docker inspect --format='{{.State.ExitCode}}' "${CONTAINER_ID}" 2>/dev/null || echo "1")
            docker logs "${CONTAINER_ID}" 2>/dev/null || true
            [ "${EXIT_CODE}" != "0" ] && echo "❌ Smoke test échoué (exit ${EXIT_CODE})" && exit 1
          fi
          docker stop "${CONTAINER_ID}" 2>/dev/null || true
          echo "✅ Smoke test OK : ${{ env.SERVICE }}"

      - name: "🐳 Push"
        if: env.SKIP_BUILD != 'true'
        run: docker push "${{ env.IMAGE }}"

  # ── GITOPS : Mise à jour du repo GitOps ─────────────────────────
  gitops:
    needs: [discover, build-service]
    runs-on: self-hosted
    if: success()
    env:
      APP_NAME: ${{ needs.discover.outputs.app_name }}

    steps:
      - name: Clean workspace
        run: |
          sudo git clean -ffdx 2>/dev/null || \
          sudo find "${{ github.workspace }}" -mindepth 1 -delete 2>/dev/null || true

      - uses: actions/checkout@v4

      - name: Checkout devops-templates
        uses: actions/checkout@v4
        with:
          repository: winddevops-org/devops-templates
          path: devops-templates
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: "🚀 Update GitOps for all microservices"
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_TOKEN }}
          APP_NAME: ${{ env.APP_NAME }}
          SHA: ${{ github.sha }}
          SERVICES: ${{ needs.discover.outputs.services }}
          REGISTRY: 192.168.1.239:8085/selfkhaoula
        run: |
          git clone "https://x-access-token:${GITOPS_PAT}@github.com/winddevops-org/gitops-environments.git" gitops-environments
          cd gitops-environments
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"

          # Parse la liste des services
          SERVICES_JSON='${{ env.SERVICES }}'
          SERVICES_LIST=$(echo "${SERVICES_JSON}" | jq -r '.[]')

          for SERVICE in ${SERVICES_LIST}; do
            COMP="${APP_NAME}-${SERVICE}"
            VPATH="environments/staging/${COMP}/values.yaml"
            mkdir -p "$(dirname "${VPATH}")"

            if [ ! -f "${VPATH}" ]; then
              cat > "${VPATH}" <<VALEOF
name: ${COMP}
namespace: staging-${COMP}
replicaCount: 1
image:
  repository: "${REGISTRY}/${COMP}"
  tag: "${SHA}"
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: nexus-registry-secret
service:
  type: ClusterIP
  port: 80
  targetPort: 80
ingress:
  enabled: true
  className: nginx
  host: ${COMP}.staging.local
  path: /
  pathType: Prefix
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
env: []
database:
  enabled: false
  type: ""
  name: ""
  storage: 1Gi
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  ha:
    enabled: true
    replicas: 2
    proxy:
      enabled: true
      replicas: 2
VALEOF
              echo "✅ values.yaml créé pour ${COMP}"
            else
              sed -i "s|repository:.*|repository: \"${REGISTRY}/${COMP}\"|" "${VPATH}"
              sed -i "s|tag:.*|tag: \"${SHA}\"|" "${VPATH}"
              echo "✅ values.yaml mis à jour pour ${COMP} → ${SHA}"
            fi

            APATH="argocd-applications/${COMP}.yaml"
            mkdir -p argocd-applications
            if [ ! -f "${APATH}" ]; then
              cat > "${APATH}" <<ARGOEOF
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${COMP}
  namespace: argocd
spec:
  project: stagiaires
  sources:
    - repoURL: https://github.com/winddevops-org/devops-templates
      targetRevision: main
      path: helm-charts/app-generic
      helm:
        valueFiles:
          - \$values/environments/staging/${COMP}/values.yaml
    - repoURL: https://github.com/winddevops-org/gitops-environments
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: staging-${COMP}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
ARGOEOF
              echo "✅ ArgoCD Application créée pour ${COMP}"
            fi
          done

          git add .
          git diff --cached --quiet && echo "Rien à commiter." && exit 0
          git pull --rebase origin main
          git commit -m "[${APP_NAME}] deploy all microservices -> ${SHA}"
          git push origin main
