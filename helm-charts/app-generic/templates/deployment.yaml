apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name | default .Release.Name }}
  labels:
    app: {{ .Values.name | default .Release.Name }}
    version: {{ .Values.image.tag }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.name | default .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name | default .Release.Name }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      
      {{- if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}

      {{- if or .Values.database.enabled .Values.persistence.enabled }}
      initContainers:
        {{- if .Values.database.enabled }}
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "app-generic.dbServiceName" . }} {{ include "app-generic.dbPort" . | trim }}; do
                echo "DB non prete, attente 3s..."
                sleep 3
              done
              echo "DB prete !"
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: init-persistent-file
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ ! -f "/data/{{ .Values.persistence.fileName }}" ]; then
                touch "/data/{{ .Values.persistence.fileName }}"
                echo "Fichier {{ .Values.persistence.fileName }} cree"
              fi
              chmod 666 "/data/{{ .Values.persistence.fileName }}"
              {{- if .Values.persistence.mountWholeDir }}
              chmod 777 /data
              {{- end }}
          volumeMounts:
            - name: persistent-data
              mountPath: /data
        {{- end }}
      {{- end }}
      
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            {{- if .Values.env }}
            {{- toYaml .Values.env | nindent 12 }}
            {{- end }}
            {{- include "app-generic.dbEnvVars" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: persistent-data
              {{- if .Values.persistence.mountWholeDir }}
              mountPath: {{ .Values.persistence.mountDir | quote }}
              {{- else }}
              mountPath: "{{ .Values.persistence.mountDir }}/{{ .Values.persistence.fileName }}"
              subPath: "{{ .Values.persistence.fileName }}"
              {{- end }}
          {{- end }}

        # === SIDECAR TAILSCALE DEFINITIF ===
        {{- if eq (.Values.name | default .Release.Name) "devops-dashboard" }}
        - name: tailscale-sidecar
          image: tailscale/tailscale:latest
          env:
          - name: TS_AUTHKEY
            value: "tskey-auth-kK9SaSWFLk11CNTRL-vVgcwmHEc54zweNatKNq54KUHKagCQaw"
          - name: TS_EXTRA_ARGS
            value: "--accept-routes"
          - name: TS_HOSTNAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: TS_USERSPACE
            value: "true"
          - name: TS_KUBE_SECRET
            value: ""
        {{- end }}
        # =================================

      volumes:
        {{- if .Values.persistence.enabled }}
        - name: persistent-data
          persistentVolumeClaim:
            claimName: {{ .Values.name | default .Release.Name }}-data
        {{- end }}
