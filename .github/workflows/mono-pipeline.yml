name: Mono Pipeline

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      GITOPS_TOKEN:
        required: true
      ACR_USERNAME:
        required: true
      ACR_PASSWORD:
        required: true

jobs:
  pipeline:
    runs-on: ${{ inputs.environment == 'production' && 'ubuntu-latest' || 'self-hosted' }}
    environment: ${{ inputs.environment }}
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Clean workspace
        run: |
          sudo git clean -ffdx 2>/dev/null || \
          sudo find "${{ github.workspace }}" -mindepth 1 -delete 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout devops-templates
        uses: actions/checkout@v4
        with:
          repository: winddevops-org/devops-templates
          path: devops-templates
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Enable Docker BuildKit
        run: echo "DOCKER_BUILDKIT=1" >> "$GITHUB_ENV"

      - name: Set APP_NAME
        run: |
          APP_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
          echo "APP_NAME=${APP_NAME}" >> "$GITHUB_ENV"

      - name: Detect deploy mode & frontend location
        run: |
          HAS_FRONT="false"; HAS_BACK="false"
          FRONT_FILE=""; FRONT_CONTEXT="."; BACK_FILE=""; BACK_CONTEXT="."
          MONO_FILE=""; FRONT_AT_ROOT="false"

          if [ -f "frontend/Dockerfile" ]; then HAS_FRONT="true"; FRONT_FILE="frontend/Dockerfile"; FRONT_CONTEXT="frontend"
          elif [ -f "Dockerfile.frontend" ]; then HAS_FRONT="true"; FRONT_FILE="Dockerfile.frontend"; FRONT_CONTEXT="."; fi

          [ "${HAS_FRONT}" = "true" ] && [ -f "package.json" ] && [ -f "angular.json" ] && FRONT_AT_ROOT="true"

          if [ -f "backend/Dockerfile" ]; then HAS_BACK="true"; BACK_FILE="backend/Dockerfile"; BACK_CONTEXT="backend"
          elif [ -f "Dockerfile.backend" ]; then HAS_BACK="true"; BACK_FILE="Dockerfile.backend"; FRONT_CONTEXT="."; fi

          if [ "${HAS_FRONT}" = "true" ] && [ "${HAS_BACK}" = "true" ]; then DEPLOY_MODE="dual"
          elif [ "${HAS_FRONT}" = "true" ]; then DEPLOY_MODE="front-only"
          elif [ "${HAS_BACK}" = "true" ]; then DEPLOY_MODE="back-only"
          elif [ -f "Dockerfile" ]; then DEPLOY_MODE="mono"; MONO_FILE="Dockerfile"
          else echo "Aucun Dockerfile trouvé."; exit 1; fi

          echo "DEPLOY_MODE=${DEPLOY_MODE}" >> "$GITHUB_ENV"
          echo "HAS_FRONT=${HAS_FRONT}" >> "$GITHUB_ENV"
          echo "HAS_BACK=${HAS_BACK}" >> "$GITHUB_ENV"
          echo "FRONT_FILE=${FRONT_FILE}" >> "$GITHUB_ENV"
          echo "FRONT_CONTEXT=${FRONT_CONTEXT}" >> "$GITHUB_ENV"
          echo "BACK_FILE=${BACK_FILE}" >> "$GITHUB_ENV"
          echo "BACK_CONTEXT=${BACK_CONTEXT}" >> "$GITHUB_ENV"
          echo "MONO_FILE=${MONO_FILE}" >> "$GITHUB_ENV"
          echo "FRONT_AT_ROOT=${FRONT_AT_ROOT}" >> "$GITHUB_ENV"

      - name: Detect backend technology & Database type
        run: |
          DB_TYPE="none"
          if [ -f "backend/pom.xml" ]; then
            echo "HAS_MAVEN=true" >> "$GITHUB_ENV"
            JAVA_VERSION=$(grep -oP '(?<=<java.version>)[^<]+' backend/pom.xml 2>/dev/null | head -1)
            [ -z "${JAVA_VERSION}" ] && JAVA_VERSION="17"
            echo "JAVA_VERSION=${JAVA_VERSION}" >> "$GITHUB_ENV"
            grep -q "postgresql" backend/pom.xml && DB_TYPE="postgresql"
            grep -q "mysql-connector" backend/pom.xml && DB_TYPE="mysql"
          else echo "HAS_MAVEN=false" >> "$GITHUB_ENV"; fi
          echo "DB_TYPE=${DB_TYPE}" >> "$GITHUB_ENV"

      - name: Setup Docker Credentials
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "${{ secrets.ACR_PASSWORD }}" | docker login windazureacr.azurecr.io -u ${{ secrets.ACR_USERNAME }} --password-stdin
          else
            sudo mkdir -p /etc/docker/certs.d/192.168.1.239:8085
            sudo cp /home/ubuntu/nexus/certs/nexus.crt /etc/docker/certs.d/192.168.1.239:8085/ca.crt || true
            sudo update-ca-certificates || true
            echo "nexus111" | docker login 192.168.1.239:8085 -u admin --password-stdin
          fi

      - name: Vérifier si l'image existe déjà
        id: check_image
        run: |
          REGISTRY="${{ inputs.environment == 'production' && 'windazureacr.azurecr.io' || '192.168.1.239:8085/selfkhaoula' }}"
          SKIP="false"
          
          if [ "${DEPLOY_MODE}" = "dual" ]; then
            IMG_F="${REGISTRY}/${APP_NAME}-front:${{ github.sha }}"
            IMG_B="${REGISTRY}/${APP_NAME}-back:${{ github.sha }}"
            docker manifest inspect "$IMG_F" >/dev/null 2>&1 && docker manifest inspect "$IMG_B" >/dev/null 2>&1 && SKIP="true"
            [ "$SKIP" = "true" ] && echo "FRONT_LOCAL_IMAGE=${IMG_F}" >> "$GITHUB_ENV" && echo "BACK_LOCAL_IMAGE=${IMG_B}" >> "$GITHUB_ENV"
          elif [ "${DEPLOY_MODE}" = "back-only" ]; then
            IMG="${REGISTRY}/${APP_NAME}-back:${{ github.sha }}"
            docker manifest inspect "$IMG" >/dev/null 2>&1 && SKIP="true"
            [ "$SKIP" = "true" ] && echo "LOCAL_IMAGE=${IMG}" >> "$GITHUB_ENV"
          elif [ "${DEPLOY_MODE}" = "front-only" ]; then
            IMG="${REGISTRY}/${APP_NAME}-front:${{ github.sha }}"
            docker manifest inspect "$IMG" >/dev/null 2>&1 && SKIP="true"
            [ "$SKIP" = "true" ] && echo "LOCAL_IMAGE=${IMG}" >> "$GITHUB_ENV"
          else
            IMG="${REGISTRY}/${APP_NAME}:${{ github.sha }}"
            docker manifest inspect "$IMG" >/dev/null 2>&1 && SKIP="true"
            [ "$SKIP" = "true" ] && echo "LOCAL_IMAGE=${IMG}" >> "$GITHUB_ENV"
          fi
          echo "SKIP_BUILD=${SKIP}" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        if: env.HAS_FRONT == 'true' && env.SKIP_BUILD != 'true'
        run: |
          NODE_IMAGE="${{ inputs.environment == 'production' && 'node:20-alpine' || '192.168.1.239:8085/selfkhaoula/node:20-alpine' }}"
          MOUNT=$([ "${FRONT_AT_ROOT}" = "true" ] && echo "$PWD" || echo "$PWD/frontend")
          docker run --rm --user "$(id -u):$(id -g)" -v "${MOUNT}:/app" -w /app \
            -e npm_config_cache=/tmp/.npm \
            "${NODE_IMAGE}" \
            npm install --legacy-peer-deps --loglevel=error --no-fund

      - name: Test frontend (Angular)
        if: env.HAS_FRONT == 'true' && env.SKIP_BUILD != 'true'
        run: |
          NODE_BROWSER_IMAGE="${{ inputs.environment == 'production' && 'node:20' || '192.168.1.239:8085/selfkhaoula/node:20-browsers' }}"
          MOUNT=$([ "${FRONT_AT_ROOT}" = "true" ] && echo "$PWD" || echo "$PWD/frontend")
          docker run --rm --user "$(id -u):$(id -g)" -v "${MOUNT}:/app" -w /app --cap-add=SYS_ADMIN \
            "${NODE_BROWSER_IMAGE}" \
            npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox 2>&1 | tee frontend-test.log || true

      - name: Test backend (Java/Maven)
        if: env.HAS_MAVEN == 'true' && env.SKIP_BUILD != 'true'
        run: |
          MAVEN_IMAGE="${{ inputs.environment == 'production' && format('maven:3.9-eclipse-temurin-{0}', env.JAVA_VERSION) || format('192.168.1.239:8085/selfkhaoula/maven:3.9-eclipse-temurin-{0}', env.JAVA_VERSION) }}"

          docker run --rm --network="host" --user "$(id -u):$(id -g)" \
            -v "$PWD/backend:/app" -w /app -v "$HOME/.m2:/root/.m2" \
            -e MAVEN_OPTS="-Xmx512m" \
            -e SPRING_DATASOURCE_URL="jdbc:postgresql://localhost:5432/testdb" \
            -e SPRING_DATASOURCE_USERNAME="testuser" \
            -e SPRING_DATASOURCE_PASSWORD="testpass" \
            "${MAVEN_IMAGE}" \
            mvn test -B -Dspring.profiles.active=test -DskipTests=false \
          || { find "$PWD/backend/target/surefire-reports" -name "*.txt" -exec cat {} \; 2>/dev/null || true; exit 1; }
      - name: Lint frontend (ESLint)
        if: env.HAS_FRONT == 'true' && env.SKIP_BUILD != 'true'
        run: |
          NODE_IMAGE="${{ inputs.environment == 'production' && 'node:20-alpine' || '192.168.1.239:8085/selfkhaoula/node:20-alpine' }}"
          MOUNT=$([ "${FRONT_AT_ROOT}" = "true" ] && echo "$PWD" || echo "$PWD/frontend")
          docker run --rm --user "$(id -u):$(id -g)" -v "${MOUNT}:/app" -w /app \
            "${NODE_IMAGE}" \
            sh -c "if node -e \"const p=require('./package.json'); process.exit(p.scripts&&p.scripts.lint?0:1);\" 2>/dev/null; then npm run lint; else echo 'Pas de script lint'; fi"

      - name: Build (mono)
        if: env.DEPLOY_MODE == 'mono' && env.SKIP_BUILD != 'true'
        run: |
          REGISTRY="${{ inputs.environment == 'production' && 'windazureacr.azurecr.io' || '192.168.1.239:8085/selfkhaoula' }}"
          IMAGE="${REGISTRY}/${APP_NAME}:${{ github.sha }}"
          docker build -f "${MONO_FILE}" -t "${IMAGE}" .
          echo "LOCAL_IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Build (dual front)
        if: env.DEPLOY_MODE == 'dual' && env.SKIP_BUILD != 'true'
        run: |
          REGISTRY="${{ inputs.environment == 'production' && 'windazureacr.azurecr.io' || '192.168.1.239:8085/selfkhaoula' }}"
          IMAGE="${REGISTRY}/${APP_NAME}-front:${{ github.sha }}"
          docker build -f "${FRONT_FILE}" -t "${IMAGE}" "${FRONT_CONTEXT}"
          echo "FRONT_LOCAL_IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Build (dual back)
        if: env.DEPLOY_MODE == 'dual' && env.SKIP_BUILD != 'true'
        run: |
          REGISTRY="${{ inputs.environment == 'production' && 'windazureacr.azurecr.io' || '192.168.1.239:8085/selfkhaoula' }}"
          IMAGE="${REGISTRY}/${APP_NAME}-back:${{ github.sha }}"
          docker build -f "${BACK_FILE}" -t "${IMAGE}" "${BACK_CONTEXT}"
          echo "BACK_LOCAL_IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Trivy scan
        if: env.SKIP_BUILD != 'true'
        continue-on-error: true
        run: |
          if [ "${DEPLOY_MODE}" = "dual" ]; then
            trivy image --severity HIGH,CRITICAL --exit-code 0 --ignore-unfixed "${FRONT_LOCAL_IMAGE}"
            trivy image --severity HIGH,CRITICAL --exit-code 0 --ignore-unfixed "${BACK_LOCAL_IMAGE}"
          else
            trivy image --severity HIGH,CRITICAL --exit-code 0 --ignore-unfixed "${LOCAL_IMAGE}"
          fi

      - name: Smoke tests
        if: env.SKIP_BUILD != 'true'
        run: |
          if [ "${DEPLOY_MODE}" = "dual" ]; then
            IMAGES=("${FRONT_LOCAL_IMAGE}" "${BACK_LOCAL_IMAGE}")
          else
            IMAGES=("${LOCAL_IMAGE}")
          fi
          for IMAGE in "${IMAGES[@]}"; do
            CONTAINER_ID=$(docker run -d --rm "${IMAGE}" 2>/dev/null || true)
            [ -z "${CONTAINER_ID}" ] && echo "Container non démarré" && exit 1
            sleep 5
            STATUS=$(docker inspect --format='{{.State.Status}}' "${CONTAINER_ID}" 2>/dev/null || echo "gone")
            if [ "${STATUS}" = "exited" ]; then
              EXIT_CODE=$(docker inspect --format='{{.State.ExitCode}}' "${CONTAINER_ID}" 2>/dev/null || echo "1")
              docker logs "${CONTAINER_ID}" 2>/dev/null || true
              [ "${EXIT_CODE}" != "0" ] && echo "Smoke test échoué (exit ${EXIT_CODE})" && exit 1
            fi
            docker stop "${CONTAINER_ID}" 2>/dev/null || true
          done

      - name: Push images
        if: env.SKIP_BUILD != 'true'
        run: |
          if [ "${DEPLOY_MODE}" = "dual" ]; then
            docker push "${FRONT_LOCAL_IMAGE}"
            docker push "${BACK_LOCAL_IMAGE}"
          else
            docker push "${LOCAL_IMAGE}"
          fi

      - name: Update GitOps
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_TOKEN }}
          APP_NAME: ${{ env.APP_NAME }}
          SHA: ${{ github.sha }}
          DB_TYPE: ${{ env.DB_TYPE }}
          DEPLOY_MODE: ${{ env.DEPLOY_MODE }}
          ENV: ${{ inputs.environment }}
          REGISTRY: ${{ inputs.environment == 'production' && 'windazureacr.azurecr.io' || '192.168.1.239:8085/selfkhaoula' }}
        run: |
          chmod +x devops-templates/.github/workflows/update-gitops.sh
          devops-templates/.github/workflows/update-gitops.sh

      - name: Résumé du pipeline
        if: always()
        run: |
          {
            echo "## 🚀 Résumé du pipeline mono"
            echo ""
            echo "| Élément | Valeur |"
            echo "|---|---|"
            echo "| Application | ${APP_NAME} |"
            echo "| Environnement | ${{ inputs.environment }} |"
            echo "| Mode de déploiement | ${DEPLOY_MODE} |"
            echo "| Build sauté (image déjà existante) | ${SKIP_BUILD:-false} |"
            echo "| Type de base de données | ${DB_TYPE:-none} |"
            if [ "${DEPLOY_MODE}" = "dual" ]; then
              echo "| Image frontend | ${FRONT_LOCAL_IMAGE:-N/A} |"
              echo "| Image backend | ${BACK_LOCAL_IMAGE:-N/A} |"
            else
              echo "| Image | ${LOCAL_IMAGE:-N/A} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
