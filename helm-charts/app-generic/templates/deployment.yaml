apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name | default .Release.Name }}
  labels:
    app: {{ .Values.name | default .Release.Name }}
    version: {{ .Values.image.tag }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.name | default .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name | default .Release.Name }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- if or .Values.database.enabled .Values.persistence.enabled }}
      initContainers:
        {{- if .Values.database.enabled }}
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "app-generic.dbServiceName" . }} {{ include "app-generic.dbPort" . | trim }}; do
                echo "DB non prete, attente 3s..."
                sleep 3
              done
              echo "DB prete !"
        {{- end }}
        {{- if .Values.persistence.enabled }}
        # --- AJOUT : cree le fichier vide sur le volume AVANT le subPath du conteneur principal.
        # Sans ca, Kubernetes cree un DOSSIER a la place du fichier au premier demarrage
        # (comportement connu de subPath sur un chemin absent), ce qui fait planter SQLite.
        - name: init-persistent-file
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ ! -f "/data/{{ .Values.persistence.fileName }}" ]; then
                touch "/data/{{ .Values.persistence.fileName }}"
                chmod 666 "/data/{{ .Values.persistence.fileName }}"
                echo "Fichier {{ .Values.persistence.fileName }} cree et droits accordes"
              else
                chmod 666 "/data/{{ .Values.persistence.fileName }}"
                echo "Fichier {{ .Values.persistence.fileName }} deja present, droits verifies"
              fi
          volumeMounts:
            - name: persistent-data
              mountPath: /data
        {{- end }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            {{- if .Values.env }}
            {{- toYaml .Values.env | nindent 12 }}
            {{- end }}
            {{- include "app-generic.dbEnvVars" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: persistent-data
              mountPath: "{{ .Values.persistence.mountDir }}/{{ .Values.persistence.fileName }}"
              subPath: "{{ .Values.persistence.fileName }}"
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: persistent-data
          persistentVolumeClaim:
            claimName: {{ .Values.name | default .Release.Name }}-data
      {{- end }}
