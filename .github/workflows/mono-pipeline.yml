name: Mono Pipeline

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      GITOPS_TOKEN:
        required: true
      ACR_USERNAME:
        required: true
      ACR_PASSWORD:
        required: true

jobs:
  pipeline:
    runs-on: self-hosted
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # ── CLEAN WORKSPACE ────────────────────────────────────────
      - name: Clean workspace
        run: |
          sudo git clean -ffdx 2>/dev/null || \
          sudo find "${{ github.workspace }}" -mindepth 1 -delete 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v4

      # ── BUILDKIT ───────────────────────────────────────────────
      - name: Enable Docker BuildKit
        run: echo "DOCKER_BUILDKIT=1" >> "$GITHUB_ENV"

      # ── APP NAME ───────────────────────────────────────────────
      - name: Set APP_NAME
        run: |
          APP_NAME=$(echo "${{ github.event.repository.name }}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9-]/-/g')
          echo "APP_NAME=${APP_NAME}" >> "$GITHUB_ENV"

      # ── DETECT MODE ───────────────────────────────────────────
      - name: Detect deploy mode & frontend location
        run: |
          HAS_FRONT="false"
          HAS_BACK="false"
          FRONT_FILE=""
          FRONT_CONTEXT="."
          BACK_FILE=""
          BACK_CONTEXT="."
          MONO_FILE=""
          FRONT_AT_ROOT="false"

          if [ -f "frontend/Dockerfile" ]; then
            HAS_FRONT="true"
            FRONT_FILE="frontend/Dockerfile"
            FRONT_CONTEXT="frontend"
          elif [ -f "Dockerfile.frontend" ]; then
            HAS_FRONT="true"
            FRONT_FILE="Dockerfile.frontend"
            FRONT_CONTEXT="."
          fi

          if [ "${HAS_FRONT}" = "true" ] && [ -f "package.json" ] && [ -f "angular.json" ]; then
            FRONT_AT_ROOT="true"
          fi

          if [ -f "backend/Dockerfile" ]; then
            HAS_BACK="true"
            BACK_FILE="backend/Dockerfile"
            BACK_CONTEXT="backend"
          elif [ -f "Dockerfile.backend" ]; then
            HAS_BACK="true"
            BACK_FILE="Dockerfile.backend"
            BACK_CONTEXT="."
          fi

          if [ "${HAS_FRONT}" = "true" ] && [ "${HAS_BACK}" = "true" ]; then
            DEPLOY_MODE="dual"
          elif [ "${HAS_FRONT}" = "true" ]; then
            DEPLOY_MODE="front-only"
          elif [ "${HAS_BACK}" = "true" ]; then
            DEPLOY_MODE="back-only"
          elif [ -f "Dockerfile" ]; then
            DEPLOY_MODE="mono"
            MONO_FILE="Dockerfile"
          else
            echo "❌ Aucun Dockerfile trouvé."
            exit 1
          fi

          echo "DEPLOY_MODE=${DEPLOY_MODE}"     >> "$GITHUB_ENV"
          echo "HAS_FRONT=${HAS_FRONT}"         >> "$GITHUB_ENV"
          echo "HAS_BACK=${HAS_BACK}"           >> "$GITHUB_ENV"
          echo "FRONT_FILE=${FRONT_FILE}"       >> "$GITHUB_ENV"
          echo "FRONT_CONTEXT=${FRONT_CONTEXT}" >> "$GITHUB_ENV"
          echo "BACK_FILE=${BACK_FILE}"         >> "$GITHUB_ENV"
          echo "BACK_CONTEXT=${BACK_CONTEXT}"   >> "$GITHUB_ENV"
          echo "MONO_FILE=${MONO_FILE}"         >> "$GITHUB_ENV"
          echo "FRONT_AT_ROOT=${FRONT_AT_ROOT}" >> "$GITHUB_ENV"
          echo "✅ Deploy mode : ${DEPLOY_MODE}"

      # ── DETECT BACKEND TECH & DB ───────────────────────────────
      - name: Detect backend technology & Database type
        run: |
          DB_TYPE="none"
          HAS_MAVEN=false
          JAVA_VERSION="17"

          if [ -f "backend/pom.xml" ]; then
            HAS_MAVEN=true
            JAVA_VERSION=$(grep -oP '(?<=<java.version>)[^<]+' backend/pom.xml 2>/dev/null | head -1)
            [ -z "${JAVA_VERSION}" ] && JAVA_VERSION="17"
            
            if grep -q "postgresql" backend/pom.xml; then DB_TYPE="postgresql"
            elif grep -q "mysql" backend/pom.xml; then DB_TYPE="mysql"
            elif grep -q "mongo" backend/pom.xml; then DB_TYPE="mongodb"
            fi
          fi

          echo "DB_TYPE=${DB_TYPE}" >> "$GITHUB_ENV"
          echo "HAS_MAVEN=${HAS_MAVEN}" >> "$GITHUB_ENV"
          echo "JAVA_VERSION=${JAVA_VERSION}" >> "$GITHUB_ENV"

      # ── MAVEN TESTS ───────────────────────────────────────────
      - name: Run Maven Tests
        if: env.HAS_MAVEN == 'true'
        continue-on-error: true
        run: |
          MAVEN_CACHE_DIR=$(mktemp -d)
          mkdir -p backend/src/test/resources
          
          cat > backend/src/test/resources/application-test.yml << EOF
          spring:
            datasource:
              url: jdbc:postgresql://localhost:5432/testdb
              username: testuser
              password: testpass
            jpa:
              hibernate:
                ddl-auto: create-drop
          EOF

          docker run --rm --network host \
            -v "${{ github.workspace }}/backend:/app" \
            -v "${MAVEN_CACHE_DIR}:/root/.m2" \
            -w /app \
            192.168.1.239:8085/selfkhaoula/maven:3.9-eclipse-temurin-${{ env.JAVA_VERSION }} \
            mvn test -B -Dspring.profiles.active=test || echo "Tests finished with errors"

      # ── MAVEN PACKAGE ──────────────────────────────────────────
      - name: Package Backend
        if: env.HAS_MAVEN == 'true'
        run: |
          MAVEN_CACHE_DIR=$(mktemp -d)
          docker run --rm --network host \
            -v "${{ github.workspace }}/backend:/app" \
            -v "${MAVEN_CACHE_DIR}:/root/.m2" \
            -w /app \
            192.168.1.239:8085/selfkhaoula/maven:3.9-eclipse-temurin-${{ env.JAVA_VERSION }} \
            mvn package -B -DskipTests

      # ── ANGULAR TESTS ─────────────────────────────────────────
      - name: Run Angular Tests
        if: env.HAS_FRONT == 'true' && env.FRONT_AT_ROOT == 'true'
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            192.168.1.239:8085/selfkhaoula/node:20-browsers \
            sh -c "npm ci --legacy-peer-deps && npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox"

      # ── ANGULAR BUILD ────────────────────────────────────────
      - name: Build Angular App
        if: env.HAS_FRONT == 'true' && env.FRONT_AT_ROOT == 'true'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            192.168.1.239:8085/selfkhaoula/node:20-browsers \
            sh -c "npm ci --legacy-peer-deps && npx ng build --configuration production"

      # ── DOCKER BUILD & PUSH ────────────────────────────────────
      - name: Setup Docker Credentials
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "${{ secrets.ACR_PASSWORD }}" | docker login windazureacr.azurecr.io -u ${{ secrets.ACR_USERNAME }} --password-stdin
          else
            sudo mkdir -p /etc/docker/certs.d/192.168.1.239:8085
            sudo cp /home/ubuntu/nexus/certs/nexus.crt /etc/docker/certs.d/192.168.1.239:8085/ca.crt
            sudo update-ca-certificates
            echo "nexus111" | docker login 192.168.1.239:8085 -u admin --password-stdin
          fi

      - name: Build & Push Images
        run: |
          REGISTRY="${{ inputs.environment == 'production' && 'windazureacr.azurecr.io' || '192.168.1.239:8085/selfkhaoula' }}"
          SHA="${{ github.sha }}"

          if [ "${DEPLOY_MODE}" = "mono" ]; then
            docker build -t "${REGISTRY}/${APP_NAME}:${SHA}" -f "${MONO_FILE}" .
            docker push "${REGISTRY}/${APP_NAME}:${SHA}"
          elif [ "${DEPLOY_MODE}" = "dual" ]; then
            docker build -t "${REGISTRY}/${APP_NAME}-backend:${SHA}" -f "${BACK_FILE}" "${BACK_CONTEXT}"
            docker build -t "${REGISTRY}/${APP_NAME}-frontend:${SHA}" -f "${FRONT_FILE}" "${FRONT_CONTEXT}"
            docker push "${REGISTRY}/${APP_NAME}-backend:${SHA}"
            docker push "${REGISTRY}/${APP_NAME}-frontend:${SHA}"
          elif [ "${DEPLOY_MODE}" = "back-only" ]; then
            docker build -t "${REGISTRY}/${APP_NAME}:${SHA}" -f "${BACK_FILE}" "${BACK_CONTEXT}"
            docker push "${REGISTRY}/${APP_NAME}:${SHA}"
          elif [ "${DEPLOY_MODE}" = "front-only" ]; then
            docker build -t "${REGISTRY}/${APP_NAME}:${SHA}" -f "${FRONT_FILE}" "${FRONT_CONTEXT}"
            docker push "${REGISTRY}/${APP_NAME}:${SHA}"
          fi

      # ── SECURITY SCAN ──────────────────────────────────────────
      - name: Trivy Security Scan
        continue-on-error: true
        run: |
          REGISTRY="${{ inputs.environment == 'production' && 'windazureacr.azurecr.io' || '192.168.1.239:8085/selfkhaoula' }}"
          SHA="${{ github.sha }}"
          
          if [ "${DEPLOY_MODE}" = "mono" ] || [ "${DEPLOY_MODE}" = "back-only" ]; then
            trivy image --severity HIGH,CRITICAL --exit-code 0 "${REGISTRY}/${APP_NAME}:${SHA}"
          elif [ "${DEPLOY_MODE}" = "dual" ]; then
            trivy image --severity HIGH,CRITICAL --exit-code 0 "${REGISTRY}/${APP_NAME}-backend:${SHA}"
            trivy image --severity HIGH,CRITICAL --exit-code 0 "${REGISTRY}/${APP_NAME}-frontend:${SHA}"
          elif [ "${DEPLOY_MODE}" = "front-only" ]; then
            trivy image --severity HIGH,CRITICAL --exit-code 0 "${REGISTRY}/${APP_NAME}:${SHA}"
          fi

      # ── SMOKE TEST ─────────────────────────────────────────────
      - name: Smoke Test
        run: |
          REGISTRY="${{ inputs.environment == 'production' && 'windazureacr.azurecr.io' || '192.168.1.239:8085/selfkhaoula' }}"
          SHA="${{ github.sha }}"
          
          if [ "${DEPLOY_MODE}" = "mono" ] || [ "${DEPLOY_MODE}" = "back-only" ]; then
            IMAGE="${REGISTRY}/${APP_NAME}:${SHA}"
          elif [ "${DEPLOY_MODE}" = "dual" ]; then
            IMAGE="${REGISTRY}/${APP_NAME}-backend:${SHA}"
          elif [ "${DEPLOY_MODE}" = "front-only" ]; then
            IMAGE="${REGISTRY}/${APP_NAME}:${SHA}"
          fi

          CONTAINER_ID=$(docker run -d --name smoke-test \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e SPRING_CLOUD_CONFIG_ENABLED=false \
            "${IMAGE}")
          
          WAITED=0
          while [ $WAITED -lt 30 ]; do
            STATUS=$(docker inspect --format='{{.State.Status}}' "${CONTAINER_ID}" 2>/dev/null || echo "gone")
            if [ "${STATUS}" = "running" ]; then
              echo "✅ Container started successfully"
              docker stop "${CONTAINER_ID}"
              exit 0
            elif [ "${STATUS}" = "exited" ]; then
              echo "Container stopped prematurely"
              docker logs "${CONTAINER_ID}"
              exit 1
            fi
            sleep 2
            WAITED=$((WAITED + 2))
          done
          echo "Timeout waiting for container"
          docker logs "${CONTAINER_ID}"
          exit 1

      # ── GITOPS UPDATE ─────────────────────────────────────────
      - name: Update GitOps Repository
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_TOKEN }}
          APP_NAME: ${{ env.APP_NAME }}
          SHA: ${{ github.sha }}
          DEPLOY_MODE: ${{ env.DEPLOY_MODE }}
          ENV: ${{ inputs.environment }}
          REGISTRY: ${{ inputs.environment == 'production' && 'windazureacr.azurecr.io' || '192.168.1.239:8085/selfkhaoula' }}
        run: |
          git clone "https://x-access-token:${GITOPS_PAT}@github.com/winddevops-org/gitops-environments.git" gitops-environments
          cd gitops-environments
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"

          TARGET_NS="${ENV}-${APP_NAME}"
          VPATH="environments/${ENV}/${APP_NAME}/values.yaml"
          mkdir -p "$(dirname "${VPATH}")"

          if [ ! -f "${VPATH}" ]; then
            if [ "${DEPLOY_MODE}" = "dual" ]; then
              printf '%s\n' \
                "name: ${APP_NAME}" \
                "namespace: ${TARGET_NS}" \
                "backend:" \
                "  image:" \
                "    repository: \"${REGISTRY}/${APP_NAME}-backend\"" \
                "    tag: \"${SHA}\"" \
                "frontend:" \
                "  image:" \
                "    repository: \"${REGISTRY}/${APP_NAME}-frontend\"" \
                "    tag: \"${SHA}\"" \
                "ingress:" \
                "  enabled: true" \
                "  host: ${APP_NAME}.${ENV}.local" > "${VPATH}"
            else
              printf '%s\n' \
                "name: ${APP_NAME}" \
                "namespace: ${TARGET_NS}" \
                "image:" \
                "  repository: \"${REGISTRY}/${APP_NAME}\"" \
                "  tag: \"${SHA}\"" \
                "ingress:" \
                "  enabled: true" \
                "  host: ${APP_NAME}.${ENV}.local" > "${VPATH}"
            fi
          else
            sed -i "s|tag:.*|tag: \"${SHA}\"|" "${VPATH}"
            sed -i "s|namespace:.*|namespace: ${TARGET_NS}|" "${VPATH}"
            sed -i "s|repository:.*|repository: \"${REGISTRY}/${APP_NAME}\"|" "${VPATH}"
          fi

          APATH="argocd-applications/${APP_NAME}-${ENV}.yaml"
          mkdir -p argocd-applications
          if [ ! -f "${APATH}" ]; then
            printf '%s\n' \
              "apiVersion: argoproj.io/v1alpha1" \
              "kind: Application" \
              "metadata:" \
              "  name: ${APP_NAME}-${ENV}" \
              "  namespace: argocd" \
              "spec:" \
              "  project: stagiaires" \
              "  sources:" \
              "    - repoURL: https://github.com/winddevops-org/devops-templates" \
              "      targetRevision: main" \
              "      path: helm-charts/app-generic" \
              "      helm:" \
              "        valueFiles:" \
              "          - \$values/environments/${ENV}/${APP_NAME}/values.yaml" \
              "    - repoURL: https://github.com/winddevops-org/gitops-environments" \
              "      targetRevision: main" \
              "      ref: values" \
              "  destination:" \
              "    server: https://kubernetes.default.svc" \
              "    namespace: ${TARGET_NS}" \
              "  syncPolicy:" \
              "    automated:" \
              "      prune: true" \
              "      selfHeal: true" \
              "    syncOptions:" \
              "      - CreateNamespace=true" > "${APATH}"
          fi

          git add .
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "[${APP_NAME}] deploy -> ${SHA} (env: ${ENV})"

          ATTEMPTS=0
          until git push origin main; do
            ATTEMPTS=$((ATTEMPTS + 1))
            [ "${ATTEMPTS}" -ge 5 ] && { echo "Push failed"; exit 1; }
            sleep $((RANDOM % 5 + 1))
            git pull --rebase origin main
          done
