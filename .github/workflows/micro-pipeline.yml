name: Micro Pipeline Standardized

on:
  workflow_call:
    inputs:
      app_name:
        required: false
        type: string
    secrets:
      GITOPS_TOKEN:
        required: true

env:
  REGISTRY: 192.168.1.239:8085/selfkhaoula
  NEXUS_CERT_PATH: /home/ubuntu/nexus/certs/nexus.crt
  NEXUS_USER: admin
  NEXUS_PASSWORD: nexus111

jobs:
  discover:
    runs-on: self-hosted
    outputs:
      services: ${{ steps.scan.outputs.services }}
      app_name: ${{ steps.scan.outputs.app_name }}
    steps:
      - name: Clean workspace files
        run: |
          sudo rm -rf "${{ github.workspace }}"/*
          sudo rm -rf "${{ github.workspace }}"/.??*

      - uses: actions/checkout@v4

      - name: Scan services
        id: scan
        run: |
          APP_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"

          SERVICES="["
          FIRST=true

          for dir in */; do
            dir="${dir%/}"
            # J'ai retiré 'frontend' et 'backend' de cette liste pour qu'ils soient scannés
            case "${dir}" in
              .github|.git|node_modules|target|dist|docs|scripts|config|helm|k8s) continue ;;
            esac
            if [ -f "${dir}/Dockerfile" ]; then
              [ "${FIRST}" = "false" ] && SERVICES="${SERVICES},"
              SERVICES="${SERVICES}\"${dir}\""
              FIRST="false"
            fi
          done

          # Cette partie reste pour scanner les sous-dossiers si tu as une structure backend/service1, etc.
          if [ -d "backend" ]; then
            for dir in backend/*/; do
              [ -d "${dir}" ] || continue
              dir="${dir%/}"
              dir="${dir##*/}"
              if [ -f "backend/${dir}/Dockerfile" ]; then
                [ "${FIRST}" = "false" ] && SERVICES="${SERVICES},"
                SERVICES="${SERVICES}\"backend/${dir}\""
                FIRST="false"
              fi
            done
          fi

          SERVICES="${SERVICES}]"
          echo "services=${SERVICES}" >> "$GITHUB_OUTPUT"

  build-service:
    needs: discover
    runs-on: self-hosted
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    env:
      APP_NAME: ${{ needs.discover.outputs.app_name }}
      SERVICE_PATH: ${{ matrix.service }}

    steps:
      - name: Clean workspace and previous test containers
        run: |
          docker rm -f "test-db-${{ matrix.service }}" 2>/dev/null || true
          docker rm -f "smoke-${{ matrix.service }}" 2>/dev/null || true
          sudo rm -rf "${{ github.workspace }}"/*
          sudo rm -rf "${{ github.workspace }}"/.??*

      - uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          SERVICE_NAME=$(basename "${{ env.SERVICE_PATH }}")
          echo "SERVICE=${SERVICE_NAME}" >> "$GITHUB_ENV"
          echo "IMAGE=${{ env.REGISTRY }}/${{ env.APP_NAME }}-${SERVICE_NAME}:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Setup Docker credentials
        run: |
          sudo mkdir -p /etc/docker/certs.d/192.168.1.239:8085
          sudo cp ${{ env.NEXUS_CERT_PATH }} /etc/docker/certs.d/192.168.1.239:8085/ca.crt
          sudo update-ca-certificates
          echo "${{ env.NEXUS_PASSWORD }}" | docker login 192.168.1.239:8085 -u ${{ env.NEXUS_USER }} --password-stdin

      - name: Check if image exists
        id: check_image
        run: |
          SKIP="false"
          if docker manifest inspect "${{ env.IMAGE }}" >/dev/null 2>&1; then
            SKIP="true"
          fi
          echo "SKIP_BUILD=${SKIP}" >> "$GITHUB_ENV"

      - name: Detect technology
        id: detect
        if: env.SKIP_BUILD != 'true'
        run: |
          DB_TYPE="none"
          HAS_MAVEN=false
          HAS_PYTHON=false
          HAS_GO=false
          HAS_ANGULAR=false
          JAVA_VERSION="17"

          if [ -f "${{ env.SERVICE_PATH }}/pom.xml" ]; then
            HAS_MAVEN=true
            JAVA_VERSION=$(grep -oP '(?<=<java.version>)[^<]+' "${{ env.SERVICE_PATH }}/pom.xml" 2>/dev/null | head -1)
            [ -z "${JAVA_VERSION}" ] && JAVA_VERSION="17"
            
            if grep -q "postgresql" "${{ env.SERVICE_PATH }}/pom.xml"; then DB_TYPE="postgresql"
            elif grep -q "mysql" "${{ env.SERVICE_PATH }}/pom.xml"; then DB_TYPE="mysql"
            elif grep -q "mongo" "${{ env.SERVICE_PATH }}/pom.xml"; then DB_TYPE="mongodb"
            fi
          fi

          if [ -f "${{ env.SERVICE_PATH }}/requirements.txt" ]; then
            HAS_PYTHON=true
            if grep -q "psycopg2\|PyMySQL" "${{ env.SERVICE_PATH }}/requirements.txt"; then
              DB_TYPE="postgresql"
            elif grep -q "pymongo" "${{ env.SERVICE_PATH }}/requirements.txt"; then
              DB_TYPE="mongodb"
            fi
          fi

          if [ -f "${{ env.SERVICE_PATH }}/go.mod" ]; then
            HAS_GO=true
            if grep -q "lib/pq\|pgx" "${{ env.SERVICE_PATH }}/go.mod"; then DB_TYPE="postgresql"
            elif grep -q "mysql" "${{ env.SERVICE_PATH }}/go.mod"; then DB_TYPE="mysql"
            elif grep -q "mongo" "${{ env.SERVICE_PATH }}/go.mod"; then DB_TYPE="mongodb"
            fi
          fi

          [ -f "${{ env.SERVICE_PATH }}/angular.json" ] && HAS_ANGULAR=true

          echo "HAS_MAVEN=${HAS_MAVEN}" >> "$GITHUB_ENV"
          echo "HAS_PYTHON=${HAS_PYTHON}" >> "$GITHUB_ENV"
          echo "HAS_GO=${HAS_GO}" >> "$GITHUB_ENV"
          echo "HAS_ANGULAR=${HAS_ANGULAR}" >> "$GITHUB_ENV"
          echo "JAVA_VERSION=${JAVA_VERSION}" >> "$GITHUB_ENV"
          echo "DB_TYPE=${DB_TYPE}" >> "$GITHUB_ENV"

      - name: Start database container
        if: env.SKIP_BUILD != 'true' && env.DB_TYPE != 'none'
        run: |
          DB_PORT=$((5432 + RANDOM % 1000))
          echo "DB_PORT=${DB_PORT}" >> "$GITHUB_ENV"
          
          if [ "${{ env.DB_TYPE }}" = "postgresql" ]; then
            docker run -d --name test-db-${{ env.SERVICE }} \
              -e POSTGRES_USER=testuser \
              -e POSTGRES_PASSWORD=testpass \
              -e POSTGRES_DB=testdb \
              -p ${DB_PORT}:5432 \
              postgres:15-alpine
            sleep 5
          elif [ "${{ env.DB_TYPE }}" = "mysql" ]; then
            docker run -d --name test-db-${{ env.SERVICE }} \
              -e MYSQL_ROOT_PASSWORD=rootpass \
              -e MYSQL_DATABASE=testdb \
              -e MYSQL_USER=testuser \
              -e MYSQL_PASSWORD=testpass \
              -p ${DB_PORT}:3306 \
              mysql:8
            sleep 10
          fi

      - name: Run Java tests
        if: env.HAS_MAVEN == 'true' && env.SKIP_BUILD != 'true'
        continue-on-error: true
        run: |
          MAVEN_CACHE_DIR=$(mktemp -d)
          
          mkdir -p "${{ env.SERVICE_PATH }}/src/test/resources"
          cat > "${{ env.SERVICE_PATH }}/src/test/resources/application-test.yml" << EOF
          spring:
            main:
              allow-bean-definition-overriding: true
            mail:
              host: localhost
              port: 25
              username: test
              password: test
            cloud:
              config:
                enabled: false
              discovery:
                enabled: false
            datasource:
              url: jdbc:postgresql://localhost:${{ env.DB_PORT }}/testdb
              username: testuser
              password: testpass
          eureka:
            client:
              enabled: false
          management:
            health:
              mail:
                enabled: false
          EOF

          docker run --rm --network host \
            -v "${{ github.workspace }}/${{ env.SERVICE_PATH }}:/app" \
            -v "${MAVEN_CACHE_DIR}:/root/.m2" \
            -w /app \
            192.168.1.239:8085/selfkhaoula/maven:3.9-eclipse-temurin-${{ env.JAVA_VERSION }} \
            mvn test -B \
              -Dspring.profiles.active=test,native \
              -Djwt.secret=ci-secret-key-for-testing-purposes-only-1234567890 \
              -Djwt.expiration=3600000 || echo "Tests finished with errors (non-blocking)"

      - name: Package Application
        if: env.HAS_MAVEN == 'true' && env.SKIP_BUILD != 'true'
        run: |
          MAVEN_CACHE_DIR=$(mktemp -d)
          docker run --rm --network host \
            -v "${{ github.workspace }}/${{ env.SERVICE_PATH }}:/app" \
            -v "${MAVEN_CACHE_DIR}:/root/.m2" \
            -w /app \
            192.168.1.239:8085/selfkhaoula/maven:3.9-eclipse-temurin-${{ env.JAVA_VERSION }} \
            mvn package -B -DskipTests \
              -Dspring.profiles.active=prod \
              -Dspring.cloud.config.enabled=false \
              -Dspring.cloud.discovery.enabled=false \
              -Deureka.client.enabled=false

      - name: Run Python tests
        if: env.HAS_PYTHON == 'true' && env.SKIP_BUILD != 'true'
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/${{ env.SERVICE_PATH }}:/app" \
            -w /app \
            192.168.1.239:8085/selfkhaoula/python:3.11-slim \
            sh -c "pip install -r requirements.txt -q && pytest --tb=short"

      - name: Run Go tests
        if: env.HAS_GO == 'true' && env.SKIP_BUILD != 'true'
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/${{ env.SERVICE_PATH }}:/app" \
            -w /app \
            192.168.1.239:8085/selfkhaoula/golang:1.22-alpine \
            go test ./... -v

      - name: Run Angular tests
        if: env.HAS_ANGULAR == 'true' && env.SKIP_BUILD != 'true'
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/${{ env.SERVICE_PATH }}:/app" \
            -w /app \
            192.168.1.239:8085/selfkhaoula/node:20-browsers \
            npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox

      - name: Build Angular Application
        if: env.HAS_ANGULAR == 'true' && env.SKIP_BUILD != 'true'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/${{ env.SERVICE_PATH }}:/app" \
            -w /app \
            192.168.1.239:8085/selfkhaoula/node:20-browsers \
            sh -c "npm ci && npm run build -- --configuration production"

      - name: Build Docker image
        if: env.SKIP_BUILD != 'true'
        run: |
          docker build \
            -f "${{ env.SERVICE_PATH }}/Dockerfile" \
            -t "${{ env.IMAGE }}" \
            "${{ env.SERVICE_PATH }}"

      - name: Security scan
        if: env.SKIP_BUILD != 'true'
        continue-on-error: true
        run: |
          trivy image --severity HIGH,CRITICAL --exit-code 0 "${{ env.IMAGE }}"

      - name: Smoke test
        if: env.SKIP_BUILD != 'true'
        run: |
          CONTAINER_ID=$(docker run -d --name smoke-${{ env.SERVICE }} \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e SPRING_CLOUD_CONFIG_ENABLED=false \
            -e SPRING_CLOUD_DISCOVERY_ENABLED=false \
            -e EUREKA_CLIENT_ENABLED=false \
            -e SPRING_MAIL_HOST=localhost \
            -e SPRING_MAIL_PORT=25 \
            "${{ env.IMAGE }}")
          
          MAX_WAIT=30
          WAITED=0
          while [ $WAITED -lt $MAX_WAIT ]; do
            STATUS=$(docker inspect --format='{{.State.Status}}' "${CONTAINER_ID}" 2>/dev/null || echo "gone")
            if [ "${STATUS}" = "running" ]; then
              echo "Container started successfully"
              docker stop "${CONTAINER_ID}"
              exit 0
            elif [ "${STATUS}" = "exited" ]; then
              echo "Container stopped prematurely"
              docker logs "${CONTAINER_ID}"
              exit 1
            fi
            sleep 2
            WAITED=$((WAITED + 2))
          done
          
          echo "Timeout after ${MAX_WAIT}s"
          docker logs "${CONTAINER_ID}"
          exit 1

      - name: Push image
        if: env.SKIP_BUILD != 'true'
        run: docker push "${{ env.IMAGE }}"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f test-db-${{ env.SERVICE }} 2>/dev/null || true
          docker rm -f smoke-${{ env.SERVICE }} 2>/dev/null || true

  gitops:
    needs: [discover, build-service]
    runs-on: self-hosted
    if: success()
    concurrency:
      group: gitops-environments-push
      cancel-in-progress: false
    env:
      APP_NAME: ${{ needs.discover.outputs.app_name }}

    steps:
      - name: Clean workspace files
        run: |
          sudo rm -rf "${{ github.workspace }}"/*
          sudo rm -rf "${{ github.workspace }}"/.??*

      - uses: actions/checkout@v4

      - name: Checkout devops-templates
        uses: actions/checkout@v4
        with:
          repository: winddevops-org/devops-templates
          path: devops-templates
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Update GitOps for all microservices
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_TOKEN }}
          APP_NAME: ${{ env.APP_NAME }}
          SHA: ${{ github.sha }}
          SERVICES: ${{ needs.discover.outputs.services }}
          REGISTRY: 192.168.1.239:8085/selfkhaoula
        run: |
          git clone "https://x-access-token:${GITOPS_PAT}@github.com/winddevops-org/gitops-environments.git" gitops-environments
          cd gitops-environments
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"

          SERVICES_JSON='${{ env.SERVICES }}'
          SERVICES_LIST=$(echo "${SERVICES_JSON}" | jq -r '.[]')

          for SERVICE_PATH in ${SERVICES_LIST}; do
            SERVICE_NAME=$(basename "${SERVICE_PATH}")
            COMP="${APP_NAME}-${SERVICE_NAME}"
            VPATH="environments/staging/${COMP}/values.yaml"
            mkdir -p "$(dirname "${VPATH}")"

            if [ ! -f "${VPATH}" ]; then
              printf '%s\n' \
                "name: ${COMP}" \
                "namespace: staging-${COMP}" \
                "replicaCount: 1" \
                "image:" \
                "  repository: \"${REGISTRY}/${COMP}\"" \
                "  tag: \"${SHA}\"" \
                "  pullPolicy: IfNotPresent" \
                "imagePullSecrets:" \
                "- name: nexus-registry-secret" \
                "service:" \
                "  type: ClusterIP" \
                "  port: 80" \
                "  targetPort: 80" \
                "ingress:" \
                "  enabled: true" \
                "  className: nginx" \
                "  host: ${COMP}.staging.local" \
                "  path: /" \
                "  pathType: Prefix" \
                "resources:" \
                "  limits:" \
                "    cpu: 500m" \
                "    memory: 512Mi" \
                "  requests:" \
                "    cpu: 250m" \
                "    memory: 256Mi" \
                "env: []" > "${VPATH}"
            else
              sed -i "s|repository:.*|repository: \"${REGISTRY}/${COMP}\"|" "${VPATH}"
              sed -i "s|tag:.*|tag: \"${SHA}\"|" "${VPATH}"
            fi

            APATH="argocd-applications/${COMP}.yaml"
            mkdir -p argocd-applications
            if [ ! -f "${APATH}" ]; then
              printf '%s\n' \
                "apiVersion: argoproj.io/v1alpha1" \
                "kind: Application" \
                "metadata:" \
                "  name: ${COMP}" \
                "  namespace: argocd" \
                "spec:" \
                "  project: stagiaires" \
                "  sources:" \
                "    - repoURL: https://github.com/winddevops-org/devops-templates" \
                "      targetRevision: main" \
                "      path: helm-charts/app-generic" \
                "      helm:" \
                "        valueFiles:" \
                "          - \$values/environments/staging/${COMP}/values.yaml" \
                "    - repoURL: https://github.com/winddevops-org/gitops-environments" \
                "      targetRevision: main" \
                "      ref: values" \
                "  destination:" \
                "    server: https://kubernetes.default.svc" \
                "    namespace: staging-${COMP}" \
                "  syncPolicy:" \
                "    automated:" \
                "      prune: true" \
                "      selfHeal: true" \
                "    syncOptions:" \
                "      - CreateNamespace=true" > "${APATH}"
            fi
          done

          git add .
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "[${APP_NAME}] deploy all microservices -> ${SHA}"

          ATTEMPTS=0
          MAX_ATTEMPTS=5
          until git push origin main; do
            ATTEMPTS=$((ATTEMPTS + 1))
            if [ "${ATTEMPTS}" -ge "${MAX_ATTEMPTS}" ]; then
              echo "Push failed after ${MAX_ATTEMPTS} attempts."
              exit 1
            fi
            echo "Push rejected, rebasing and retrying (attempt ${ATTEMPTS}/${MAX_ATTEMPTS})..."
            sleep $((RANDOM % 5 + 1))
            git pull --rebase origin main
          done
